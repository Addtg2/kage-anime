# pnpm v10+ требует поле `packages` в workspace-файле. У нас не настоящий
# монорепо — указываем только корень. Файл нужен для `allowBuilds`, который
# разрешает postinstall-скрипты конкретным зависимостям (без него pnpm их
# блокирует в целях безопасности).
packages:
  - "."

allowBuilds:
  esbuild: true
  msw: false
  sharp: true
  unrs-resolver: true
  workerd: true
